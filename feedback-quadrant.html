<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — Emotional Context</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --border: #2e2e38;
      --text: #e8e8ec;
      --muted: #5a5a6e;
      --thumb-size: 28px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -20%, rgba(255,255,255,0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .label-tag {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    /* Emoji stage */
    .face-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      min-height: 72px;
    }

    .stage-emoji {
      font-size: 3rem;
      line-height: 1;
      transition: transform 0.12s ease;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.4));
    }

    .stage-emoji.pop {
      transform: scale(1.22);
    }

    .stage-text {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .emotion-label {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .emotion-sublabel {
      font-family: 'Syne Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Quadrant */
    .q-outer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      user-select: none;
      -webkit-user-select: none;
    }

    .q-mid-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .q-circle {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      flex-shrink: 0;
      background: var(--surface);
    }
    .q-circle:active { cursor: grabbing; }

    .q-bg { position: absolute; width: 50%; height: 50%; }
    .q-bg.tl { top:0; left:0;
      background: radial-gradient(circle at 100% 100%, rgba(255,148,52,0.15) 0%, transparent 68%); }
    .q-bg.tr { top:0; right:0;
      background: radial-gradient(circle at 0% 100%, rgba(255,213,48,0.15) 0%, transparent 68%); }
    .q-bg.bl { bottom:0; left:0;
      background: radial-gradient(circle at 100% 0%, rgba(120,110,170,0.15) 0%, transparent 68%); }
    .q-bg.br { bottom:0; right:0;
      background: radial-gradient(circle at 0% 0%, rgba(70,185,212,0.15) 0%, transparent 68%); }

    .q-axis-h {
      position: absolute; top: 50%; left: 0; right: 0;
      height: 1px; background: var(--border);
    }
    .q-axis-v {
      position: absolute; left: 50%; top: 0; bottom: 0;
      width: 1px; background: var(--border);
    }
    .q-center-mark {
      position: absolute; top: 50%; left: 50%;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border);
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .q-dot {
      position: absolute;
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 2px 14px rgba(0,0,0,0.55);
      transform: translate(-50%, -50%);
      top: 50%; left: 50%;
      z-index: 10;
      pointer-events: none;
      transition: background 0.18s ease;
    }
    .q-dot::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--bg);
      opacity: 0.25;
    }

    .q-lbl {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .q-lbl.q-top    { color: rgba(255,185,55,0.85); }
    .q-lbl.q-bottom { color: rgba(70,190,215,0.85); }
    .q-lbl.q-left   {
      color: rgba(145,125,190,0.85);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.12em;
    }
    .q-lbl.q-right  {
      color: rgba(255,200,55,0.85);
      writing-mode: vertical-rl;
      letter-spacing: 0.12em;
    }

    /* Submit */
    .submit-area {
      display: flex;
      justify-content: flex-end;
    }

    button.submit {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      padding: 0.8em 2em;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button.submit:hover  { opacity: 0.85; transform: scale(1.03); }
    button.submit:active { transform: scale(0.97); }

    /* Confirmation */
    .confirm {
      display: none;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 0;
    }
    .confirm.show { display: flex; }
    .confirm-row { display: flex; align-items: center; gap: 0.75rem; }
    .confirm .big { font-size: 2.5rem; line-height: 1; }
    .confirm-label {
      font-family: 'Syne Mono', monospace;
      font-size: 1rem;
      white-space: nowrap;
    }
    .confirm p {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: 'Syne Mono', monospace;
    }
  </style>
</head>
<body>
<div class="card">

  <div class="header">
    <span class="label-tag">Emotional Context</span>
    <h1>How does the risk feel?</h1>
  </div>

  <!-- Emoji stage -->
  <div class="face-stage">
    <span class="stage-emoji" id="stageEmoji">😐</span>
    <div class="stage-text">
      <span class="emotion-label" id="emotionLabel">Neutral</span>
      <span class="emotion-sublabel">how you're feeling</span>
    </div>
  </div>

  <!-- Quadrant circle -->
  <div class="q-outer">
    <span class="q-lbl q-top">Excited</span>
    <div class="q-mid-row">
      <span class="q-lbl q-left">Bored</span>
      <div class="q-circle" id="qCircle">
        <div class="q-bg tl"></div>
        <div class="q-bg tr"></div>
        <div class="q-bg bl"></div>
        <div class="q-bg br"></div>
        <div class="q-axis-h"></div>
        <div class="q-axis-v"></div>
        <div class="q-center-mark"></div>
        <div class="q-dot" id="qDot"></div>
      </div>
      <span class="q-lbl q-right">Stimulated</span>
    </div>
    <span class="q-lbl q-bottom">Scared</span>
  </div>

  <!-- Submit -->
  <div class="submit-area">
    <button class="submit" id="submitBtn">Submit feedback</button>
  </div>

  <div class="confirm" id="confirm">
    <div class="confirm-row">
      <span class="big" id="confirmFace"></span>
      <span class="confirm-label" id="confirmLabel" style="color:var(--muted)"></span>
    </div>
    <p>Feedback received. Thank you.</p>
  </div>

</div>
<script>
  // ─── DOM refs ──────────────────────────────────────────────────────────────
  const stageEmoji   = document.getElementById('stageEmoji');
  const emotionLabel = document.getElementById('emotionLabel');
  const qCircle      = document.getElementById('qCircle');
  const qDot         = document.getElementById('qDot');
  const submitBtn    = document.getElementById('submitBtn');
  const confirm      = document.getElementById('confirm');
  const confirmFace  = document.getElementById('confirmFace');
  const confirmLabel = document.getElementById('confirmLabel');

  let currentEx = 0, currentSt = 0;
  let lastEmoji = '😐';

  // ─── Emotion mapping ───────────────────────────────────────────────────────
  function blendColor(ex, st) {
    const tx = (st + 1) / 2, ty = (ex + 1) / 2;
    const c = {
      bl: [120, 110, 170], br: [70,  185, 212],
      tl: [255, 148,  52], tr: [255, 213,  48],
    };
    const l3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    return `rgb(${l3(l3(c.bl, c.br, tx), l3(c.tl, c.tr, tx), ty).map(Math.round).join(',')})`;
  }

  function getEmotionLabel(ex, st) {
    const mag = Math.sqrt(ex * ex + st * st);
    if (mag < 0.22) return 'neutral';
    if (ex >  0.45 && st >  0.45) return 'thrilled';
    if (ex >  0.45 && st < -0.45) return 'restless';
    if (ex < -0.45 && st >  0.45) return 'anxious';
    if (ex < -0.45 && st < -0.45) return 'resigned';
    if (ex >  0.6)  return 'excited';
    if (ex < -0.6)  return 'scared';
    if (st >  0.6)  return 'energized';
    if (st < -0.6)  return 'disengaged';
    if (ex >  0.2 && st >  0.2) return 'curious';
    if (ex >  0.2 && st < -0.2) return 'eager';
    if (ex < -0.2 && st >  0.2) return 'uneasy';
    if (ex < -0.2 && st < -0.2) return 'hesitant';
    return 'unsettled';
  }

  function getEmotionEmoji(ex, st) {
    const map = {
      thrilled: '🤩', restless: '😤', anxious: '😰', resigned: '😔',
      excited: '😄', scared: '😨', energized: '⚡', disengaged: '😑',
      curious: '🤔', eager: '😊', uneasy: '😟', hesitant: '😬',
      neutral: '😐', unsettled: '😕',
    };
    return map[getEmotionLabel(ex, st)] || '😐';
  }

  // ─── Update display ────────────────────────────────────────────────────────
  function updateDisplay(ex, st) {
    currentEx = ex; currentSt = st;
    const color = blendColor(ex, st);
    const label = getEmotionLabel(ex, st);
    const emoji = getEmotionEmoji(ex, st);

    // Pop animation when emoji changes
    if (emoji !== lastEmoji) {
      stageEmoji.classList.remove('pop');
      void stageEmoji.offsetWidth; // reflow
      stageEmoji.classList.add('pop');
      setTimeout(() => stageEmoji.classList.remove('pop'), 130);
      lastEmoji = emoji;
    }

    stageEmoji.textContent    = emoji;
    emotionLabel.textContent  = label;
    emotionLabel.style.color  = color;
    qDot.style.background     = color;
  }

  // ─── Drag logic ────────────────────────────────────────────────────────────
  let isDragging = false;

  function resolvePos(clientX, clientY) {
    const rect    = qCircle.getBoundingClientRect();
    const r       = rect.width / 2;
    const maxDist = r - 15;
    let dx = clientX - (rect.left + r);
    let dy = clientY - (rect.top  + r);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) { const s = maxDist / dist; dx *= s; dy *= s; }
    return { vx: (dx + r) / (r * 2), vy: (dy + r) / (r * 2), nx: dx / maxDist, ny: dy / maxDist };
  }

  function applyPos({ vx, vy, nx, ny }) {
    qDot.style.left = `${(vx * 100).toFixed(2)}%`;
    qDot.style.top  = `${(vy * 100).toFixed(2)}%`;
    updateDisplay(-ny, nx);
  }

  function xy(e) { const s = e.touches ? e.touches[0] : e; return [s.clientX, s.clientY]; }

  qCircle.addEventListener('mousedown', e => { isDragging = true; applyPos(resolvePos(...xy(e))); e.preventDefault(); });
  document.addEventListener('mousemove', e => { if (isDragging) applyPos(resolvePos(...xy(e))); });
  document.addEventListener('mouseup',    () => { isDragging = false; });
  document.addEventListener('mouseleave', () => { isDragging = false; });

  qCircle.addEventListener('touchstart', e => { isDragging = true; applyPos(resolvePos(...xy(e))); }, { passive: true });
  document.addEventListener('touchmove',  e => { if (isDragging) applyPos(resolvePos(...xy(e))); }, { passive: true });
  document.addEventListener('touchend',  () => { isDragging = false; });

  // ─── Submit ────────────────────────────────────────────────────────────────
  submitBtn.addEventListener('click', () => {
    const color = blendColor(currentEx, currentSt);
    confirmFace.textContent  = getEmotionEmoji(currentEx, currentSt);
    confirmLabel.textContent = getEmotionLabel(currentEx, currentSt);
    confirmLabel.style.color = color;
    confirm.classList.add('show');
    setTimeout(() => {
      confirm.classList.remove('show');
      qDot.style.left = '50%';
      qDot.style.top  = '50%';
      updateDisplay(0, 0);
    }, 2800);
  });

  updateDisplay(0, 0);
</script>
</body>
</html>
