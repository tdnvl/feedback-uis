
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — Project Journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --border: #2e2e38;
      --text: #e8e8ec;
      --muted: #5a5a6e;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -20%, rgba(255,255,255,0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .header { display: flex; flex-direction: column; gap: 0.4rem; }

    .label-tag {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    /* Position stage — mirrors emoji-stage from other pages */
    .position-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      min-height: 72px;
    }

    .pos-icon {
      font-size: 2.2rem;
      line-height: 1;
      transition: all 0.35s ease;
      flex-shrink: 0;
    }

    .pos-text {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .pos-place {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: color 0.35s ease;
    }

    .pos-phase {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Garden container */
    .garden-wrap {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: crosshair;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    .garden-wrap:active { cursor: grabbing; }

    #gardenSvg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }

    /* Submit */
    .submit-area { display: flex; justify-content: flex-end; }

    button.submit {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      padding: 0.8em 2em;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button.submit:hover  { opacity: 0.85; transform: scale(1.03); }
    button.submit:active { transform: scale(0.97); }

    /* Confirmation */
    .confirm {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0;
      text-align: center;
    }
    .confirm.show { display: flex; }
    .confirm-row { display: flex; align-items: center; gap: 0.75rem; }
    .confirm .big { font-size: 2.2rem; line-height: 1; }
    .confirm-place {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .confirm-phase {
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .confirm p {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: 'Syne Mono', monospace;
    }

    @keyframes pondShimmer {
      0%, 100% { opacity: 0.08; }
      50%       { opacity: 0.22; }
    }
    .shimmer-1 { animation: pondShimmer 3.4s ease-in-out infinite; }
    .shimmer-2 { animation: pondShimmer 2.8s ease-in-out infinite 1.1s; }
  </style>
</head>
<body>

<script>
  const svg          = document.getElementById('gardenSvg');
  const gardenPath   = document.getElementById('gardenPath');
  const progressPath = document.getElementById('progressPath');
  const dot          = document.getElementById('gardenDot');
  const posIcon      = document.getElementById('posIcon');
  const posPlace     = document.getElementById('posPlace');
  const posPhase     = document.getElementById('posPhase');
  const submitBtn    = document.getElementById('submitBtn');
  const confirmEl    = document.getElementById('confirm');
  const confirmEmoji = document.getElementById('confirmEmoji');
  const confirmPlace = document.getElementById('confirmPlace');
  const confirmPhase = document.getElementById('confirmPhase');

  const SAMPLES = 700;
  let pathLength, sampledPoints = [];
  let currentT = 0;
  let isDragging = false;

  // ── Stage definitions ────────────────────────────────────────────────────
  const STAGES = [
    { from: 0,    to: 0.08, icon: '🚪', place: 'At the gate',             phase: 'just getting started'      },
    { from: 0.08, to: 0.28, icon: '🌸', place: 'Among the first flowers', phase: 'early momentum'             },
    { from: 0.28, to: 0.50, icon: '🐟', place: 'By the koi pond',         phase: 'finding your rhythm'        },
    { from: 0.50, to: 0.68, icon: '🪑', place: 'At the bench',            phase: 'midpoint — taking stock'    },
    { from: 0.68, to: 0.86, icon: '🌺', place: 'Through the back garden', phase: 'making real progress'       },
    { from: 0.86, to: 1.01, icon: '🌿', place: 'Nearing the end',         phase: 'the final stretch'          },
  ];

  function getStage(t) {
    return STAGES.find(s => t >= s.from && t < s.to) || STAGES[STAGES.length - 1];
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  function init() {
    pathLength = gardenPath.getTotalLength();

    for (let i = 0; i <= SAMPLES; i++) {
      const len = (i / SAMPLES) * pathLength;
      sampledPoints.push({ t: i / SAMPLES, pt: gardenPath.getPointAtLength(len) });
    }

    progressPath.style.strokeDasharray  = pathLength;
    progressPath.style.strokeDashoffset = pathLength;

    placeDotAt(0);
  }

  // ── Coordinate helpers ───────────────────────────────────────────────────
  function toSVG(clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function nearest(svgX, svgY) {
    let minD = Infinity, best = sampledPoints[0];
    for (const s of sampledPoints) {
      const dx = s.pt.x - svgX, dy = s.pt.y - svgY;
      const d = dx * dx + dy * dy;
      if (d < minD) { minD = d; best = s; }
    }
    return best;
  }

  // ── Place dot ────────────────────────────────────────────────────────────
  function placeDotAt(t) {
    currentT = t;
    const len = t * pathLength;
    const pt  = gardenPath.getPointAtLength(len);

    dot.setAttribute('transform', `translate(${pt.x.toFixed(2)},${pt.y.toFixed(2)})`);
    progressPath.style.strokeDashoffset = pathLength - len;

    const stage = getStage(t);
    posIcon.textContent  = stage.icon;
    posPlace.textContent = stage.place;
    posPhase.textContent = stage.phase;
  }

  function handleAt(clientX, clientY) {
    const sv = toSVG(clientX, clientY);
    placeDotAt(nearest(sv.x, sv.y).t);
  }

  // ── Pointer events ───────────────────────────────────────────────────────
  svg.addEventListener('mousedown', e => {
    isDragging = true;
    handleAt(e.clientX, e.clientY);
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (isDragging) handleAt(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup',    () => { isDragging = false; });
  document.addEventListener('mouseleave', () => { isDragging = false; });

  svg.addEventListener('touchstart', e => {
    isDragging = true;
    const t = e.touches[0];
    handleAt(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const t = e.touches[0];
    handleAt(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchend', () => { isDragging = false; });

  // ── Submit ───────────────────────────────────────────────────────────────
  submitBtn.addEventListener('click', () => {
    const stage = getStage(currentT);
    confirmEmoji.textContent = stage.icon;
    confirmPlace.textContent = stage.place;
    confirmPhase.textContent = stage.phase;
    confirmEl.classList.add('show');
    setTimeout(() => {
      confirmEl.classList.remove('show');
      placeDotAt(0);
    }, 2800);
  });

  init();
</script>
</body>
</html>
